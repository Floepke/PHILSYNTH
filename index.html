<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PHILSYNTH</title>
  <link rel="icon" type="image/svg+xml" href="src/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input id="file" type="file" accept=".mds,.json" hidden>
  <button id="brand" class="brand" type="button" aria-haspopup="menu" aria-expanded="false" title="Main menu: New, Open, Save, Export Audio, MIDI Input…"><span class="logo"></span>PHILSYNTH</button>
  <div id="workspace">
    <section id="seq" aria-label="Piano roll">
      <div id="roll" class="seq-view"></div>
    </section>
    <div id="seq-split" class="splitter horizontal" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Piano roll / patcher divider" aria-controls="seq patcher" title="Drag the exposed divider to resize the piano roll and controller panel; pushes the lower divider when they meet. Arrow keys resize; Home/End move to an edge.">
      <div id="seq-bar" role="toolbar" aria-label="Sequencer controls">
        <div id="seq-bar-content">
          <button id="seq-play" class="seq-play" title="Play song (.) / toggle (Space)">▶</button>
          <span id="seq-pos" class="seq-pos" title="Play position: bar.beat.hundredths">1.1.00</span>
          <span class="seq-sep"></span>
          <label class="seq-field seq-clip" title="Name of the selected clip"><span>Clip</span><input id="seq-name" type="text" spellcheck="false"></label>
          <label class="seq-field" id="seq-target-field" title="Module number (main patch) that plays the notes of this clip"><span>Send to</span><select id="seq-target"></select></label>
          <label class="seq-field" id="seq-ctl-field" title="Controller of the target module that this automation clip drives" hidden><span>Controller</span><select id="seq-ctl"></select></label>
          <span class="seq-sep"></span>
          <label class="seq-field" title="Time grid: visual guide; snaps piano-roll editing when Free timing is off"><span>Grid</span><select id="seq-snap-base"></select></label>
          <span class="seq-div" title="…divided by">÷</span>
          <input id="seq-snap-div" class="seq-div-input" type="number" min="1" max="64" step="1" value="1" aria-label="Grid divider">
          <label class="seq-field" title="Draw, move, resize and paste notes and edit velocity-curve times without snapping. The dark/light grid remains visible; timeline and automation keep snapping."><input id="seq-free-time" type="checkbox"><span>Free timing</span></label>
        </div>
      </div>
    </div>
    <section id="patcher" aria-label="Patcher">
      <aside id="panel"><div id="panel-content"></div></aside>
      <div id="panel-split" class="splitter" role="separator" aria-orientation="vertical" aria-label="Controller panel width" title="Drag left/right to resize the controller panel; grab above the grip to move the upper horizontal divider or below it to move the lower one up/down; drag fully left to hide the panel"></div>
      <main id="canvas">
        <div id="world"><svg id="cables"></svg></div>
        <button id="zoom" title="Zoom level — click to fit all modules in view">100%</button>
      </main>
    </section>
    <div id="seq-hsplit" class="splitter horizontal" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Patcher / TimeLine divider" aria-controls="patcher arranger" title="Drag up/down to resize the TimeLine and left/right to resize the controller panel; pushes the upper divider when they meet. Arrow keys resize; Home/End move to an edge.">
      <nav id="crumbs" aria-label="Patch path"></nav>
    </div>
    <div id="arranger" class="seq-view" role="region" aria-label="TimeLine"></div>
  </div>
  <footer id="statusbar">
    <span id="status"></span>
    <span id="tip" role="status" hidden></span>
    <span id="doc-name" class="doc-name" title="Project file"></span>
    <div id="cpu" title="DSP load: share of the audio thread's real-time budget used to render the patch">
      <span class="cpu-label">DSP</span>
      <canvas id="cpu-graph" width="60" height="14"></canvas>
      <span id="cpu-value">–</span>
    </div>
  </footer>

  <dialog id="insert-dialog">
    <form method="dialog">
      <h3>Insert module</h3>
      <div id="module-list" class="listbox" role="listbox" tabindex="0" aria-label="Module type" autofocus></div>
      <menu>
        <button type="button" id="load-synth" class="menu-left" title="Insert a module saved as a .synth file (right-click hold a module: Save module…)">Load .synth…</button>
        <button value="cancel">Cancel</button>
        <button value="ok" class="primary">OK</button>
      </menu>
    </form>
    <input id="synth-file" type="file" accept=".synth" hidden>
  </dialog>

  <!-- in-app dialogs: native confirm() crashes Electron on some Linux desktops -->
  <dialog id="confirm-dialog">
    <form method="dialog">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-text"></p>
      <menu>
        <button value="cancel" id="confirm-cancel">Cancel</button>
        <button value="ok" class="primary" id="confirm-ok" autofocus>OK</button>
      </menu>
    </form>
  </dialog>

  <dialog id="unsaved-dialog">
    <form method="dialog">
      <h3 id="unsaved-title">Save changes?</h3>
      <p id="unsaved-text"></p>
      <menu>
        <button value="yes" class="primary" id="unsaved-yes" autofocus>Yes</button>
        <button value="no" id="unsaved-no">No</button>
        <button value="cancel" id="unsaved-cancel">Cancel</button>
      </menu>
    </form>
  </dialog>

  <dialog id="sig-dialog">
    <form method="dialog">
      <h3 id="sig-title">Time signature</h3>
      <div class="sig-fields">
        <input id="sig-num" type="number" min="1" max="32" step="1" aria-label="Beats per bar">
        <span class="sig-slash">/</span>
        <select id="sig-den" aria-label="Beat note value"></select>
      </div>
      <p id="sig-where" class="dialog-note"></p>
      <menu>
        <!-- OK first: Enter in the number field submits with the first button -->
        <button value="ok" class="primary sig-ok">OK</button>
        <button value="cancel" class="sig-cancel">Cancel</button>
        <button value="delete" id="sig-delete" class="danger">Remove</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
